<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Ian McCallum</title>
    <link rel="icon" type="image/png" href="assets/IMlogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vista-design-system.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="vista-desktop">
    <!-- GIF Background -->
    <div id="frutiger-background" class="fixed inset-0 z-0">
        <img id="background-gif" class="background-gif" src="assets/20251124_1315_Remix Video_remix_01kavmnrbpec59aep90j7an7yk.gif" alt="Frutiger Aero Background">
        <div class="video-overlay absolute inset-0"></div>
    </div>

    <!-- Vista Taskbar -->
    <div class="vista-taskbar">
        <button id="vista-start-button" class="vista-start-button">
            <i class="fab fa-windows"></i>
        </button>
        <div class="vista-taskbar-items">
            <a href="index.html" class="vista-taskbar-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="about.html" class="vista-taskbar-item">
                <i class="fas fa-user"></i>
                <span>About</span>
            </a>
            <a href="portfolio.html" class="vista-taskbar-item">
                <i class="fas fa-briefcase"></i>
                <span>Portfolio</span>
            </a>
            <a href="contact.html" class="vista-taskbar-item">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </div>
        <div class="vista-system-tray">
            <div class="vista-tray-item"><i class="fas fa-volume-up"></i></div>
            <div class="vista-tray-item"><i class="fas fa-wifi"></i></div>
            <div class="vista-tray-time" id="vista-time"></div>
        </div>
    </div>

    <!-- Vista Start Menu -->
    <div id="vista-start-menu" class="vista-start-menu">
        <div class="vista-start-menu-left">
            <a href="index.html" class="vista-start-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="about.html" class="vista-start-item"><i class="fas fa-user"></i><span>About Ian</span></a>
            <a href="portfolio.html" class="vista-start-item"><i class="fas fa-briefcase"></i><span>Portfolio</span></a>
            <a href="cv.html" class="vista-start-item"><i class="fas fa-file-alt"></i><span>CV / Resume</span></a>
            <a href="testimonials.html" class="vista-start-item"><i class="fas fa-quote-left"></i><span>Testimonials</span></a>
            <a href="photos.html" class="vista-start-item"><i class="fas fa-images"></i><span>Photos</span></a>
            <a href="contact.html" class="vista-start-item"><i class="fas fa-envelope"></i><span>Contact</span></a>
        </div>
        <div class="vista-start-menu-right">
            <a href="about.html" class="vista-start-item"><i class="fas fa-user"></i><span>Ian McCallum</span></a>
            <a href="portfolio.html" class="vista-start-item"><i class="fas fa-folder"></i><span>Portfolio</span></a>
            <a href="cv.html" class="vista-start-item"><i class="fas fa-file"></i><span>CV</span></a>
            <a href="contact.html" class="vista-start-item"><i class="fas fa-cog"></i><span>Contact</span></a>
        </div>
    </div>

    <!-- Main Content - Vista Windows -->
    <div class="vista-windows-container">
        <div class="vista-window" style="max-width: 600px; margin: 80px auto;">
            <div class="vista-title-bar">
                <div class="vista-title-text">
                    <i class="fas fa-check-circle me-2"></i>
                    Message Sent Successfully
                </div>
                <div class="vista-window-controls">
                    <button class="vista-control-btn minimize"><i class="fas fa-minus"></i></button>
                    <button class="vista-control-btn maximize"><i class="fas fa-square"></i></button>
                    <button class="vista-control-btn close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="vista-window-content" style="text-align: center; padding: 60px 40px;">
                <div style="font-size: 80px; color: var(--vista-green); margin-bottom: 30px; animation: vistaCheckPulse 2s ease-in-out infinite;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 class="vista-h1 vista-glass-text mb-4">Thank You!</h1>
                <p class="vista-body-text" style="font-size: 18px; margin-bottom: 40px;">
                    Your message has been sent successfully. I'll get back to you as soon as possible.
                </p>
                <a href="index.html" class="vista-button vista-button-primary">
                    <i class="fas fa-home"></i>
                    <span>Return to Homepage</span>
                </a>
            </div>
        </div>
    </div>

    <style>
        @keyframes vistaCheckPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/gif-background.js"></script>
    <script src="js/vista-system.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
