    <script>
        // Photo Lightbox Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const lightbox = document.getElementById('photo-lightbox');
            const lightboxImg = document.getElementById('lightbox-image');
            const lightboxBackdrop = lightbox.querySelector('.photo-lightbox-backdrop');
            const closeBtn = lightbox.querySelector('.photo-lightbox-close');
            const photoFrames = document.querySelectorAll('.vintage-photo-frame');
            
            // Open lightbox when photo is clicked
            photoFrames.forEach(frame => {
                frame.addEventListener('click', function(e) {
                    // Don't open if clicking on overlay icons
                    if (e.target.closest('.vintage-photo-overlay')) return;
                    
                    const photoSrc = this.getAttribute('data-photo');
                    const photoAlt = this.getAttribute('data-alt') || 'Photo';
                    
                    lightboxImg.src = photoSrc;
                    lightboxImg.alt = photoAlt;
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });
            
            // Close lightbox
            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }
            
            closeBtn.addEventListener('click', closeLightbox);
            lightboxBackdrop.addEventListener('click', closeLightbox);
            
            // Close on Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });
        });
    </script>
